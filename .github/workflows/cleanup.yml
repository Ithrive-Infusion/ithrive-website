name: One-time cleanup of stray files

# Removes copies of site files that were uploaded to the top folder by mistake.
# The real files live in src/, public/ and scripts/. This workflow deletes itself when done.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stray top-level files
        run: |
          git rm --ignore-unmatch -- \
            404.astro Base.astro Faq.astro Footer.astro Header.astro Hours.astro Legal.astro Photo.astro \
            _redirects about.astro check.yml contact.astro download "download (1)" "faq (2).astro" \
            favicon.svg fetch-images.mjs global.css hormone-therapy.astro index.astro injections.astro \
            iv-therapy.astro lib.ts medical-disclaimer.astro membership.astro netlify.toml privacy.astro \
            robots.txt services.json site.json terms.astro weight-loss.astro \
            .github/workflows/cleanup.yml
          printf 'node_modules/\ndist/\n.astro/\n.DS_Store\n' > .gitignore
          git add .gitignore
      - name: Check the site still builds
        run: |
          npm ci
          npx astro build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove stray files from the top folder"
          git push
